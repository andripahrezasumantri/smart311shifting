    // URL Google Apps Script Anda
    const SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbx1v8BwqZA5BsOZCHHP45N-HkED6cl6yuJ9x7qt-3LIZwNMvrSEl1fRgf9qy9s6PJDY/exec";

    // Helper Function untuk mendapatkan tanggal hari ini dalam format YYYY-MM-DD
    const getTodayFormatted = () => {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    // Helper Function normalisasi format tanggal dari API ke YYYY-MM-DD
    const normalizeDate = (rawDate) => {
      if (!rawDate) return getTodayFormatted();
      const d = new Date(rawDate);
      if (isNaN(d.getTime())) return rawDate.toString().trim();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    // Daftar Nama Supervisor Resmi
    const OFFICIAL_SPVS = ["Lesti", "Denny", "Adhi", "Salman", "Yulinda", "Betty", "Rival", "Rini", "Baihaqi", "Puteri"];

        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />

        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />

    const BookOpenIcon = () => (
      <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
      </svg>
    );

    function App() {
      const getCachedData = () => {
        const cached = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (cached) {
          try { return JSON.parse(cached); } catch (e) {}
        }
        return [];
      };

      const getCachedUploadedFiles = () => {
        const cached = localStorage.getItem(LOCAL_STORAGE_FILES_KEY);
        if (cached) {
          try { return JSON.parse(cached); } catch (e) {}
        }
        return [];
      };

      const [schedules, setSchedules] = useState(getCachedData);
      const [uploadedFiles, setUploadedFiles] = useState(getCachedUploadedFiles);
      const [selectedDate, setSelectedDate] = useState(getTodayFormatted);
      const [roleFilter, setRoleFilter] = useState('ALL');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isGuideOpen, setIsGuideOpen] = useState(false);
      const [toastMessage, setToastMessage] = useState('');
      const [isSyncing, setIsSyncing] = useState(false);
      const [currentTime, setCurrentTime] = useState('');

      const fileInputRef = useRef(null);

      // TIMER REAL-TIME WITA
      useEffect(() => {
        const updateClock = () => {
          const now = new Date();
          const timeString = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          setCurrentTime(`${timeString} WITA`);
        };
        updateClock();
        const timer = setInterval(updateClock, 1000);
        return () => clearInterval(timer);
      }, []);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 4000);
      };

      // Fetch Data dari Google Sheets API
      const fetchFromSheets = async () => {
        try {
          setIsSyncing(true);
          const response = await fetch(SHEETS_API_URL);
          if (response.ok) {
            const data = await response.json();
            if (Array.isArray(data)) {
              const normalizedData = data.map(item => ({
                ...item,
                date: normalizeDate(item.date)
              }));
              setSchedules(normalizedData);
              localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(normalizedData));
            }
          }
        } catch (error) {
          console.warn("Menggunakan cache lokal karena Sheets API offline.", error);
        } finally {
          setIsSyncing(false);
        }
      };

      // Auto Fetch Saat Pertama Buka & Auto Polling Tiap 5 Detik
      useEffect(() => {
        fetchFromSheets();
        const interval = setInterval(() => {
          fetchFromSheets();
        }, 5000);

        return () => clearInterval(interval);
      }, []);

      // FITUR IMPOR AUTOMATIS DARI FILE EXCEL HRS DENGAN LOGIKA SPK REVISI
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const fileName = file.name.trim();

        if (uploadedFiles.includes(fileName)) {
          const confirmOverwrite = window.confirm(
            `⚠️ PERINGATAN FILE DUPLIKAT!\n\nFile dengan nama "${fileName}" sudah pernah di-upload sebelumnya!\n\nApakah Anda yakin ingin meng-upload ulang dan memperbarui data jadwal dari file ini?`
          );
          if (!confirmOverwrite) {
            if (fileInputRef.current) fileInputRef.current.value = "";
            return;
          }
        }

        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            setIsSyncing(true);
            const bstr = evt.target.result;
            const wb = XLSX.read(bstr, { type: 'binary' });
            const sheetName = wb.SheetNames[0];
            const ws = wb.Sheets[sheetName];
            
            const rawData = XLSX.utils.sheet_to_json(ws, { header: 1 });

            let year = 2026;
            let month = 11;

            const monthNames = ["JANUARI", "FEBRUARI", "MARET", "APRIL", "MEI", "JUNI", "JULI", "AGUSTUS", "SEPTEMBER", "OKTOBER", "NOVEMBER", "DESEMBER"];
            const monthNamesShort = ["JAN", "FEB", "MAR", "APR", "MEI", "JUN", "JUL", "AGT", "SEP", "OKT", "NOV", "DES"];

            for (let r = 0; r < Math.min(5, rawData.length); r++) {
              const rowStr = JSON.stringify(rawData[r] || "").toUpperCase();
              monthNames.forEach((mFull, idx) => {
                if (rowStr.includes(mFull) || rowStr.includes(monthNamesShort[idx])) {
                  month = idx + 1;
                }
              });
              const yearMatch = rowStr.match(/20\d{2}/);
              if (yearMatch) {
                year = parseInt(yearMatch[0]);
              }
            }

            let dateRowIndex = -1;
            let dateColMap = {};

            for (let r = 0; r < Math.min(10, rawData.length); r++) {
              const row = rawData[r];
              if (Array.isArray(row)) {
                row.forEach((cell, cIdx) => {
                  if (typeof cell === 'number' && cell >= 1 && cell <= 31) {
                    if (dateRowIndex === -1) dateRowIndex = r;
                    dateColMap[cIdx] = cell;
                  }
                });
              }
              if (dateRowIndex !== -1) break;
            }

            if (dateRowIndex === -1) {
              alert("Gagal membaca header tanggal pada file Excel. Pastikan terdapat baris angka tanggal (1 - 31).");
              setIsSyncing(false);
              return;
            }

            const parsedSchedules = [];
            const timestampBase = Date.now();
            let countId = 0;

            for (let r = dateRowIndex + 1; r < rawData.length; r++) {
              const row = rawData[r];
              if (!row || row.length === 0) continue;

              let rawName = (row[0] || row[1] || "").toString().trim();
              if (!rawName || rawName.toUpperCase().includes("NAMA") || rawName.toUpperCase().includes("WORLD")) continue;

              let cleanedName = rawName.toUpperCase();
              let matchedSpv = OFFICIAL_SPVS.find(s => cleanedName.includes(s.toUpperCase()));
              let finalName = matchedSpv ? matchedSpv : rawName;
              let role = matchedSpv ? "SUPERVISOR" : "PASS";

              Object.keys(dateColMap).forEach(colIdx => {
                const dayNum = dateColMap[colIdx];
                const dayStr = String(dayNum).padStart(2, '0');
                const monthStr = String(month).padStart(2, '0');
                const dateStr = `${year}-${monthStr}-${dayStr}`;

                const cellVal = (row[colIdx] || "").toString().trim().toUpperCase();
                if (!cellVal) return;

                let shift = "Shift 1";
                let sidakKasir = "-";
                let mod = "NO MOD";

                if (cellVal === "P") {
                  shift = "Shift 1";
                } else if (cellVal === "S") {
                  shift = "Shift 2";
                } else if (cellVal === "OFF" || cellVal === "RO") {
                  shift = "OFF";
                } else if (cellVal === "PD") {
                  shift = "PERJALANAN DINAS";
                } else if (cellVal === "CUTI") {
                  shift = "CUTI";
                } else if (cellVal === "LHB") {
                  shift = "LHB";
                } else if (cellVal === "SPK") {
                  shift = "Shift 2";
                  mod = "MOD";
                  sidakKasir = finalName;
                } else {
                  shift = cellVal;
                }

                parsedSchedules.push({
                  id: `id_${timestampBase}_${countId++}`,
                  date: dateStr,
                  name: finalName,
                  role: role,
                  mod: mod,
                  sidakKasir: sidakKasir,
                  shift: shift,
                  sourceFile: fileName
                });
              });
            }

            if (parsedSchedules.length > 0) {
              const filteredOldData = schedules.filter(item => item.sourceFile !== fileName);
              const updatedList = [...parsedSchedules, ...filteredOldData];

              setSchedules(updatedList);
              localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(updatedList));

              const updatedFilesList = [...new Set([fileName, ...uploadedFiles])];
              setUploadedFiles(updatedFilesList);
              localStorage.setItem(LOCAL_STORAGE_FILES_KEY, JSON.stringify(updatedFilesList));

              try {
                await fetch(SHEETS_API_URL, {
                  method: 'POST',
                  body: JSON.stringify({ action: 'bulk_add', data: parsedSchedules })
                });
              } catch (err) {
                console.error("Gagal sinkron massal ke Sheets:", err);
              }

              const firstDateParsed = `${year}-${String(month).padStart(2, '0')}-01`;
              setSelectedDate(firstDateParsed);

              showToast(`Berhasil mengimpor ${parsedSchedules.length} data dari file '${fileName}'!`);
            } else {
              alert("Tidak ada data jadwal valid yang dapat dibaca dari file Excel.");
            }

          } catch (err) {
            console.error("Error parsing file Excel:", err);
            alert("Terjadi kesalahan saat membaca file Excel.");
          } finally {
            setIsSyncing(false);
            if (fileInputRef.current) fileInputRef.current.value = "";
          }
        };

        reader.readAsBinaryString(file);
      };

      // Form State
      const [formData, setFormData] = useState({
        date: getTodayFormatted(),
        name: '',
        role: 'PASS',
        mod: 'NO MOD',
        sidakKasir: '-',
        shift: 'Shift 1',
      });
      const [errorMessage, setErrorMessage] = useState('');

      const handleResetData = async () => {
        if (window.confirm("Apakah Anda yakin ingin mengosongkan seluruh data di Google Sheets dan mereset riwayat upload?")) {
          setSchedules([]);
          setUploadedFiles([]);
          localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify([]));
          localStorage.setItem(LOCAL_STORAGE_FILES_KEY, JSON.stringify([]));
          try {
            await fetch(SHEETS_API_URL, {
              method: 'POST',
              body: JSON.stringify({ action: 'reset' })
            });
          } catch (e) {
            console.error("Gagal mereset Sheets:", e);
          }
          showToast("Data Google Sheets & Riwayat Upload telah dibersihkan!");
        }
      };

      const filteredDateSchedules = useMemo(() => {
        return schedules.filter((item) => item.date === selectedDate);
      }, [schedules, selectedDate]);

      const activeDisplaySchedules = useMemo(() => {
        if (roleFilter === 'SUPERVISOR') {
          return filteredDateSchedules.filter((item) => item.role === 'SUPERVISOR');
        }
        return filteredDateSchedules;
      }, [filteredDateSchedules, roleFilter]);

      const shift1Schedules = useMemo(() => {
        return activeDisplaySchedules.filter((item) => item.shift === 'Shift 1');
      }, [activeDisplaySchedules]);

      const shift2Schedules = useMemo(() => {
        return activeDisplaySchedules.filter((item) => item.shift === 'Shift 2');
      }, [activeDisplaySchedules]);

      const otherSchedules = useMemo(() => {
        return activeDisplaySchedules.filter((item) => !['Shift 1', 'Shift 2'].includes(item.shift));
      }, [activeDisplaySchedules]);

      const shiftCounts = useMemo(() => {
        const counts = { 'Shift 1': 0, 'Shift 2': 0, OFF: 0, CUTI: 0, LHB: 0, SAKIT: 0, 'PERJALANAN DINAS': 0 };
        activeDisplaySchedules.forEach((item) => {
          if (counts[item.shift] !== undefined) {
            counts[item.shift]++;
          }
        });
        return counts;
      }, [activeDisplaySchedules]);

      const sidakKasirShift1 = useMemo(() => {
        const names = activeDisplaySchedules
          .filter((item) => item.shift === 'Shift 1' && item.sidakKasir && item.sidakKasir !== '-')
          .map((item) => item.sidakKasir);
        return [...new Set(names)];
      }, [activeDisplaySchedules]);

      const sidakKasirShift2 = useMemo(() => {
        const names = activeDisplaySchedules
          .filter((item) => item.shift === 'Shift 2' && item.sidakKasir && item.sidakKasir !== '-')
          .map((item) => item.sidakKasir);
        return [...new Set(names)];
      }, [activeDisplaySchedules]);

      const spvPureCounts = useMemo(() => {
        let s1 = 0;
        let s2 = 0;
        filteredDateSchedules.forEach((item) => {
          if (item.role === 'SUPERVISOR') {
            if (item.shift === 'Shift 1') s1++;
            if (item.shift === 'Shift 2') s2++;
          }
        });
        return { s1, s2 };
      }, [filteredDateSchedules]);

      const isIdeal = useMemo(() => {
        return spvPureCounts.s1 >= 3 && spvPureCounts.s2 >= 3;
      }, [spvPureCounts]);

      const handleInputChange = (e) => {
        const { name, value } = e.target;
        setFormData((prev) => ({ ...prev, [name]: value }));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!formData.date || !formData.name.trim() || !formData.role || !formData.mod || !formData.shift) {
          setErrorMessage('Tolong lengkapi data.');
          return;
        }

        const newId = 'id_' + Date.now();
        const newSchedule = {
          id: newId,

              </div>
            )}

            {/* MODAL TAMBAH JADWAL RESPONSIVE */}
            {isModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/60 backdrop-blur-xs">
                <div className="bg-white rounded-xl max-w-md w-full p-4 sm:p-6 shadow-2xl border border-zinc-200">
                  <div className="flex justify-between items-center pb-3 border-b border-zinc-100">
                    <div>
                      <h3 className="text-sm sm:text-base font-bold text-zinc-900">Tambah Jadwal Supervisor</h3>
                      <p className="text-[10px] sm:text-xs text-zinc-500 font-medium mt-0.5">MDS DUTAMALL BANJARMASIN - 311</p>
                    </div>
                    <button 
                      onClick={() => setIsModalOpen(false)}
                      className="text-zinc-400 hover:text-zinc-600 p-1 rounded-md hover:bg-zinc-100"
                    >
                      <XIcon />
                    </button>
                  </div>

                  {errorMessage && (
                    <div className="mt-3 p-2.5 bg-rose-50 text-rose-700 border border-rose-200 text-xs rounded-lg font-medium">
                      {errorMessage}
                    </div>
                  )}

                  <form onSubmit={handleSubmit} className="mt-3 space-y-3">
                    <div>
                      <label className="block text-xs font-bold text-zinc-600 mb-1">Tanggal</label>
                      <input
                        type="date"
                        name="date"
                        value={formData.date}
                        onChange={handleInputChange}
                        className="w-full px-3 py-2 border border-zinc-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:outline-none text-xs sm:text-sm text-zinc-800"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-zinc-600 mb-1">Nama</label>
                      <input
                        type="text"
                        name="name"
                        placeholder="Contoh: Lesti"
                        value={formData.name}
                        onChange={handleInputChange}
                        className="w-full px-3 py-2 border border-zinc-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:outline-none text-xs sm:text-sm text-zinc-800"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-zinc-600 mb-1">Jabatan / Role</label>
                      <select
                        name="role"
                        value={formData.role}
                        onChange={handleInputChange}
                        className="w-full px-3 py-2 border border-zinc-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:outline-none text-xs sm:text-sm text-zinc-800 bg-white"
                      >
                        <option value="PASS">PASS</option>
                        <option value="SA SENIOR">SA SENIOR</option>
                        <option value="TEKNISI">TEKNISI</option>
                        <option value="SUPERVISOR">SUPERVISOR</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-zinc-600 mb-1">Status MOD</label>
                      <select
                        name="mod"
                        value={formData.mod}
                        onChange={handleInputChange}
                        className="w-full px-3 py-2 border border-zinc-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:outline-none text-xs sm:text-sm text-zinc-800 bg-white"
                      >
                        <option value="NO MOD">NO MOD</option>
                        <option value="MOD">MOD</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-zinc-600 mb-1">Sidak Kasir</label>
                      <select
                        name="sidakKasir"
                        value={formData.sidakKasir}
                        onChange={handleInputChange}
                        className="w-full px-3 py-2 border border-zinc-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:outline-none text-xs sm:text-sm text-zinc-800 bg-white"
                      >
                        <option value="-">- Tidak Ada -</option>
                        {OFFICIAL_SPVS.map(name => (
                          <option key={name} value={name}>{name}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-zinc-600 mb-1">Shift</label>
                      <select
                        name="shift"
                        value={formData.shift}
                        onChange={handleInputChange}
                        className="w-full px-3 py-2 border border-zinc-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:outline-none text-xs sm:text-sm text-zinc-800 bg-white"
                      >
                        <option value="Shift 1">Shift 1</option>
                        <option value="Shift 2">Shift 2</option>
                        <option value="OFF">OFF</option>
                        <option value="CUTI">CUTI</option>
                        <option value="LHB">LHB</option>
                        <option value="SAKIT">SAKIT</option>
                        <option value="PERJALANAN DINAS">PERJALANAN DINAS</option>
                      </select>
                    </div>

                    <div className="flex gap-2.5 pt-3 border-t border-zinc-100">
                      <button
                        type="button"
                        onClick={() => setIsModalOpen(false)}
                        className="w-1/2 py-2 border border-zinc-300 text-zinc-600 rounded-lg font-medium hover:bg-zinc-50 transition text-xs"
                      >
                        Batal
                      </button>
                      <button
                        type="submit"
                        className="w-1/2 py-2 bg-slate-900 text-white rounded-lg font-bold hover:bg-slate-800 transition text-xs shadow-sm"
                      >
                        Simpan
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>

          <footer className="mt-8 sm:mt-12 text-center text-[10px] sm:text-xs text-zinc-400 font-medium py-3 border-t border-zinc-200/80 max-w-7xl mx-auto w-full px-4">
            Smart Shifting System © 2026 | Built with Precision by Andri Pahreza S. (APS Design System)
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
